# Builds Bevel95 and runs its tests on Windows for every push and pull request.
# The Rust version is fixed to the one the project is developed with, so that a new
# compiler's new lints cannot turn this red by themselves. Raise it here when you raise
# your own toolchain.
name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.99.1 (MSVC)
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --release
