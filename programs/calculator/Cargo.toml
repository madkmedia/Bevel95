[package]
name = "calculator"
build = "../../tools/build/program_icon.rs"
description = "Calculator for Bevel95's Windows 95, 98, and 2000 looks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[test]]
name = "program_icon"
path = "../../platform/tests/program_icon.rs"

[build-dependencies]
bevel-core = { path = "../../core" }

[dev-dependencies]
# The tests never write the real data folder (decisions.md, "Milestone 1 decisions"): in a test
# build the log and every state file go to a scratch folder.
bevel-winkit = { path = "../../platform/winkit", features = ["test-scratch"] }

[dependencies]
bevel-core = { path = "../../core" }
bevel-winkit = { path = "../../platform/winkit" }
# Raw Win32 bindings, the same pinned version as the bar's (the clipboard for Edit > Copy).
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
