[package]
name = "folders"
build = "../../tools/build/program_icon.rs"
description = "Windows 95's folder windows (My Computer and every folder) for Bevel95"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[test]]
name = "program_icon"
path = "../../platform/tests/program_icon.rs"

[build-dependencies]
bevel-core = { path = "../../core" }

[dev-dependencies]
# The tests never write the real data folder (decisions.md, "Milestone 1 decisions"): in a test
# build the log and every state file go to a scratch folder.
bevel-winkit = { path = "../../platform/winkit", features = ["test-scratch"] }

[dependencies]
bevel-core = { path = "../../core" }
bevel-winkit = { path = "../../platform/winkit" }
# Raw Win32 bindings, the same pinned version as the bar's.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
