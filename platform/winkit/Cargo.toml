[package]
name = "bevel-winkit"
description = "The Windows side shared by Bevel95's programs: fonts from GDI, the control kit's window host, menus, the log"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Only for the tests: %LOCALAPPDATA% is replaced by a scratch folder (log::installed_dir). Never
# on in a released program: it is switched on only by the dev-dependencies below and in the other
# crates.
test-scratch = []

[dev-dependencies]
# This crate's own integration tests (tests/*.rs) get the scratch folder too.
bevel-winkit = { path = ".", features = ["test-scratch"] }

[dependencies]
bevel-core = { path = "../../core" }
# Raw Win32 bindings, the same pinned version as the bar's.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Data_HtmlHelp",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
