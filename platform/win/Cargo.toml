[package]
name = "bevel95"
build = "../../tools/build/program_icon.rs"
description = "The Bevel95 taskbar for Windows"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[test]]
name = "program_icon"
path = "../tests/program_icon.rs"

[build-dependencies]
bevel-core = { path = "../../core" }

[dev-dependencies]
# The tests never write the real data folder (decisions.md, "Milestone 1 decisions"): in a test
# build the log and every state file go to a scratch folder.
bevel-winkit = { path = "../winkit", features = ["test-scratch"] }

[dependencies]
bevel-core = { path = "../../core" }
bevel-winkit = { path = "../winkit" }
# The only runtime dependency allowed (raw Win32 bindings). Pinned exactly.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # GDI+'s flat functions: reading a wallpaper's picture file (BMP, JPEG, PNG, GIF).
    "Win32_Graphics_GdiPlus",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
